services:
  identity:
    build:
      context: services/identity-api
      dockerfile: Dockerfile
    container_name: identity_app
    env_file:
      - .env
    environment:
      APP_DATABASE_HOST: db
      APP_DATABASE_PORT: "5432"
      APP_REDIS_HOST: redis
      APP_REDIS_PORT: "6379"
      APP_RABBITMQ_HOST: rabbitmq
      APP_RABBITMQ_PORT: "5672"
    ports:
      - "8080:8080"
    networks:
      - identity-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
  audit-worker:
    build:
      context: workers/audit-worker
      dockerfile: Dockerfile
    container_name: audit_worker_app
    env_file:
      - .env
    environment:
      APP_REDIS_HOST: redis
      APP_REDIS_PORT: "6379"
      APP_RABBITMQ_HOST: rabbitmq
      APP_RABBITMQ_PORT: "5672"
    ports:
      - "8081:8081"
    networks:
      - identity-network
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:18-alpine
    container_name: identity_db
    ports:
      - "${APP_DATABASE_PORT}:5432"
    environment:
      POSTGRES_DB: ${APP_DATABASE_NAME}
      POSTGRES_USER: ${APP_DATABASE_USER}
      POSTGRES_PASSWORD: ${APP_DATABASE_PASSWORD}
    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
      ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - database-data:/var/lib/postgresql
    restart: unless-stopped
    networks:
      - identity-network
  redis:
    image: redis:7-alpine
    container_name: identity-redis
    ports:
      - "${APP_REDIS_PORT}:6379"
    environment:
      - APP_REDIS_PASSWORD=${APP_REDIS_PASSWORD:?APP_REDIS_PASSWORD is required}
    command: >
      sh -c "exec redis-server --appendonly yes --requirepass \"$$APP_REDIS_PASSWORD\""
    volumes:
      - redis-data:/data
    networks:
      - identity-network
    healthcheck:
      test: [
        "CMD-SHELL",
        "redis-cli -a \"$${APP_REDIS_PASSWORD}\" ping | grep -q PONG",
      ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:4.2.3-management
    container_name: identity_rabbitmq
    ports:
      - "${APP_RABBITMQ_PORT}:5672"
      - "${APP_RABBITMQ_CLIENT_PORT}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${APP_RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${APP_RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - identity-network
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.3.1
    container_name: identity_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - identity-network
    restart: unless-stopped
  loki:
    image: grafana/loki:3.4.2
    container_name: identity_loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/config.yaml:/etc/loki/config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/config.yaml
    networks:
      - identity-network
    restart: unless-stopped
  alloy:
    image: grafana/alloy:v1.7.2
    container_name: identity_alloy
    ports:
      - "12345:12345"
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      ALLOY_CONFIG_PATH: /etc/alloy/config.alloy
    networks:
      - identity-network
    depends_on:
      loki:
        condition: service_started
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.6.2
    container_name: identity_grafana
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    networks:
      - identity-network
    restart: unless-stopped

networks:
  identity-network:
    driver: bridge

volumes:
  database-data:
  redis-data:
  prometheus-data:
  loki-data:
  grafana-data:
