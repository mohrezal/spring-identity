groups:
  - name: service-availability
    rules:
      - alert: IdentityApiDown
        expr: up{job="identity-api"} == 0
        for: 2m
        labels:
          severity: critical
          service: identity-api
        annotations:
          summary: Identity API is unavailable
          description: Prometheus has been unable to scrape the Identity API for two minutes.

      - alert: AuditWorkerDown
        expr: up{job="audit-worker"} == 0
        for: 2m
        labels:
          severity: critical
          service: audit-worker
        annotations:
          summary: Audit worker is unavailable
          description: Prometheus has been unable to scrape the audit worker for two minutes.

  - name: identity-api-reliability
    rules:
      - alert: IdentityApiHighServerErrorRate
        expr: >-
          sum(rate(http_server_requests_seconds_count{job="identity-api",status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_server_requests_seconds_count{job="identity-api"}[5m])), 0.001)
          > 0.05
        for: 10m
        labels:
          severity: warning
          service: identity-api
        annotations:
          summary: Identity API server-error rate is above 5%
          description: More than 5% of Identity API requests have returned 5xx responses for ten minutes.

      - alert: IdentityApiHighP95Latency
        expr: >-
          histogram_quantile(
            0.95,
            sum(rate(http_server_requests_seconds_bucket{job="identity-api"}[5m])) by (le)
          ) > 1
        for: 10m
        labels:
          severity: warning
          service: identity-api
        annotations:
          summary: Identity API p95 latency is above one second
          description: The aggregate p95 request latency has exceeded one second for ten minutes.

      - alert: IdentityApiDatabasePoolNearCapacity
        expr: >-
          max(hikaricp_connections_active{job="identity-api"})
          /
          clamp_min(max(hikaricp_connections_max{job="identity-api"}), 1)
          > 0.9
        for: 5m
        labels:
          severity: warning
          service: identity-api
        annotations:
          summary: Identity API database pool is near capacity
          description: More than 90% of database connections have been active for five minutes.

  - name: audit-pipeline-reliability
    rules:
      - alert: AuditEventValidationFailures
        expr: increase(audit_events_validation_failed_total{job="audit-worker"}[10m]) > 0
        labels:
          severity: warning
          service: audit-worker
        annotations:
          summary: Audit events are failing contract validation
          description: At least one audit event failed schema validation during the last ten minutes.
