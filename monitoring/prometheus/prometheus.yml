global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: identity-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - identity:8080
        labels:
          application: identity-api

  - job_name: audit-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - audit-worker:8081
        labels:
          application: audit-worker
