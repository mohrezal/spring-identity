server:
  shutdown: graceful

management:
  server:
    port: ${APP_MANAGEMENT_PORT:8083}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,prometheus
  tracing:
    sampling:
      probability: ${APP_TRACING_SAMPLING_PROBABILITY:0.1}

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
